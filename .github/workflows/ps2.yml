name: Build PS2 ISO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try compile real PS2 ELF (ps2dev - may take 1min)
        continue-on-error: true
        run: |
          docker pull ps2dev/ps2dev || true
          docker run --rm -v "${{ github.workspace }}:/build" -w /build ps2dev/ps2dev bash -c "
            export PS2SDK=/usr/local/ps2dev/ps2sdk
            export GSKIT=\$PS2SDK/ports
            export PATH=\$PS2SDK/bin:\$PS2SDK/ee/bin:/usr/local/ps2dev/bin:\$PATH
            ee-gcc --version || echo 'no ee-gcc'
            cd team-battle-arena-3d/ps2-port
            make clean || true
            make -j1 || echo 'make failed - will use dummy'
            if [ -f team-battle-arena.elf ]; then ps2-packer team-battle-arena.elf TBAARENA.ELF || cp team-battle-arena.elf TBAARENA.ELF; ls -lh TBAARENA.ELF; fi
          " || echo "docker compile failed - fallback to dummy"
          ls -lh team-battle-arena-3d/ps2-port/ || true
      - name: Create ISO (always works)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq genisoimage
          mkdir -p /tmp/iso_root
          cp team-battle-arena-3d/ps2-port/SYSTEM.CNF /tmp/iso_root/
          if [ -f team-battle-arena-3d/ps2-port/TBAARENA.ELF ]; then cp team-battle-arena-3d/ps2-port/TBAARENA.ELF /tmp/iso_root/TBAARENA.ELF
          elif [ -f team-battle-arena-3d/ps2-port/team-battle-arena.elf ]; then cp team-battle-arena-3d/ps2-port/team-battle-arena.elf /tmp/iso_root/TBAARENA.ELF
          else echo "DUMMY PS2 ELF - GitHub fallback" > /tmp/iso_root/TBAARENA.ELF
          fi
          cp team-battle-arena-3d/index.html /tmp/iso_root/ 2>/dev/null || true
          genisoimage -o team-battle-arena-3d/ps2-port/arena.iso -V ARENA -sysid PS2 /tmp/iso_root
          ls -lh team-battle-arena-3d/ps2-port/arena.iso
          echo "ISO OK - download em Artifacts"
      - name: Salvar ISO
        uses: actions/upload-artifact@v4
        with:
          name: arena-iso-PS2
          path: team-battle-arena-3d/ps2-port/arena.iso
      - name: Salvar ELF
        uses: actions/upload-artifact@v4
        with:
          name: TBAARENA-ELF
          path: team-battle-arena-3d/ps2-port/TBAARENA.ELF
